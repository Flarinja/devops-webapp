name: CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/