name: CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Send Slack success notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"SUCCESS: CI pipeline passed for devops-webapp on commit ${{ github.sha }}"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Send Slack failure notification
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"FAILURE: CI pipeline failed for devops-webapp on commit ${{ github.sha }}"}' \
            "$SLACK_WEBHOOK_URL"